experiment:
  name: "fm_fine_latents"
  mode: "train"
  seed: 1255
  model_tag: Null

logging:
  run: "dummy"                 # wandb run name; 'dummy' disables logging (--run)

data:
  data_path: "data/"
  num_val_samples: 1000

gpt:
  vocab_size: 32768
  n_layer: 12
  n_head: 12
  n_kv_head: 4  # GQA for optimized memory
  n_embd: 768
  intermediate_size: 2048
  max_position_embeddings: 2048
  rope_theta: 100000.0  # SmolLM2 / Qwen 2.5 style

tokenizer:
  dir: "tokenizer"

training:
  use_gradient_checkpointing: True
  device: "cuda"
  save_dir: "results"
  save_interval: 2500
  eval_interval: 20
  sample_interval: 10
  resume_from_checkpoint: Null
  use_bitsandbytes: True
  gradient_accumulation_steps: 8
  compile_model: True
  batch_size: 4
  num_workers: 4
  device_batch_size: 32
  total_batch_size: -1

  # Training Horizon Settings
  num_iterations: -1           # Explicit number of optimization steps; -1 = disable (--num-iterations)
  target_flops: -1.0           # Run to reach target FLOP count; -1 = disable (--target-flops)
  target_param_data_ratio: 90  # Maintain data:param ratio; Chinchilla=20, -1 = disable (--target-param-data-ratio)

optimizer:
  lr: 1.8e-3
  embedding_lr: 0.3
  wd: 0.02
  warmup_steps: 40
  final_lr_frac: 0.05

sampling:
  sample_file: "sample.txt"
  temperature: 1.0

evaluation:
  eval_tokens: 41943040
